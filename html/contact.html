<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Mi Sitio Web</title>
  <!-- Vinculamos la misma hoja de estilos para mantener el diseño -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Encabezado y Menú (Se mantiene igual para navegar entre páginas) -->
<header>
  <h1>Mi Sitio Web</h1>
  <nav>
    <a href="../index.html">Inicio</a>
    <a href="#">Acerca de</a>
    <a href="contact.html">Contacto</a>
  </nav>
</header>

<!-- Contenido Principal -->
<main>
  <section class="contenedor-contacto">
    <h2>Ponte en contacto</h2>
    <p>Déjanos tu mensaje y te responderemos lo antes posible.</p>

    <!-- Formulario de contacto -->
    <form action="#" method="POST" class="formulario-contacto">
      <div class="grupo-campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
      </div>

      <div class="grupo-campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required placeholder="tu@correo.com">
      </div>

      <div class="grupo-campo">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
      </div>

      <button type="submit" class="btn-enviar">Enviar Mensaje</button>
    </form>
  </section>
</main>

<!-- Pie de página -->
<footer>
  <p>&copy; 2026 - Mi Sitio Web</p>
</footer>

</body>
</html>
